  <!-- Trophy base -->
  <rect x="40" y="57" width="20" height="5" rx="2" fill="#d97706"/>
  <!-- Star on trophy -->
  <polygon points="50,28 52.4,33.8 58.5,34.2 53.8,38.2 55.2,44.2 50,41 44.8,44.2 46.2,38.2 41.5,34.2 47.6,33.8" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.5"/>
  <!-- Math symbols row -->
  <text x="50" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#6366f1" letter-spacing="3">+−×÷</text>
